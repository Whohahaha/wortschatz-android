name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test core logic
        run: ./gradlew :core:test

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: wortschatz-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Keeps a "latest" pre-release with the newest APK, so it can be downloaded straight to a phone.
      - name: Publish latest APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk wortschatz-debug.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest wortschatz-debug.apk --prerelease --target "$GITHUB_SHA" \
            --title "最新测试版" --notes "main 分支最新提交自动编译的调试版 APK。"
