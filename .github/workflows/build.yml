name: Build APK

on:
  push:
    # release/** builds an APK from code not yet on main (for example while a PR is open).
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A newer push supersedes a build still running, so two runs never race to publish.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test core logic
        run: ./gradlew :core:test

      # Pronunciation: every word, plural, verb form and example is synthesized with Piper
      # (offline neural TTS, German "thorsten" voice, CC0) and bundled into the APK.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Grammar data (articles, plurals, verb forms) for completing imported word lists,
      # built from the kaikki.org extract of Wiktionary. Rebuilt only when the script changes.
      - name: Restore lexicon
        id: lexicon
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/lexicon
          key: lexicon-${{ hashFiles('tools/lexicon/build_lexicon.py') }}

      - name: Build lexicon
        if: steps.lexicon.outputs.cache-hit != 'true'
        # The app works without it (no auto-completion), so a failure here must not block the APK.
        continue-on-error: true
        run: python tools/lexicon/build_lexicon.py app/src/main/assets/lexicon/de.tsv.gz || (rm -rf app/src/main/assets/lexicon; exit 1)

      - name: Restore generated audio
        uses: actions/cache@v4
        with:
          path: .audio-cache
          key: audio-thorsten-high-${{ hashFiles('app/src/main/assets/wordbooks/**', 'core/src/main/kotlin/app/wortschatz/core/Audio.kt', 'tools/gen_audio.py') }}
          restore-keys: audio-thorsten-high-

      - name: Generate pronunciation audio
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          python -m pip install piper-tts==1.3.0
          python -m piper.download_voices --data-dir .voices de_DE-thorsten-high
          ./gradlew :core:audioManifest
          python tools/gen_audio.py build/audio-manifest.tsv .voices/de_DE-thorsten-high.onnx .audio-cache app/src/main/assets/audio

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      # A different signature would force users to uninstall, and lose their progress, to update.
      - name: Check signing key
        run: |
          expected=$(grep '^certSha256=' signing/keystore.properties | cut -d= -f2)
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          actual=$("$apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          echo "expected $expected, got $actual"
          test "$actual" = "$expected"

      - uses: actions/upload-artifact@v4
        with:
          name: wortschatz-arm64-v8a-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release-branch APK
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_REF_NAME//\//-}"
          cp app/build/outputs/apk/debug/app-debug.apk wortschatz-arm64-v8a-debug.apk
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" wortschatz-arm64-v8a-debug.apk --prerelease --target "$GITHUB_SHA" \
            --title "$GITHUB_REF_NAME" --notes "从 $GITHUB_REF_NAME 分支编译的调试版 APK（仅 arm64-v8a）。"

      # Keeps a "latest" pre-release with the newest APK, so it can be downloaded straight to a phone.
      - name: Publish latest APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk wortschatz-arm64-v8a-debug.apk
          gh release delete latest --yes --cleanup-tag || true
          # One-off helper releases from earlier data fetches; no longer needed.
          gh release delete wortliste --yes --cleanup-tag || true
          gh release delete lexicon-probe --yes --cleanup-tag || true
          gh release create latest wortschatz-arm64-v8a-debug.apk --prerelease --target "$GITHUB_SHA" \
            --title "最新测试版" --notes "main 分支最新提交自动编译的调试版 APK（仅 arm64-v8a）。"
