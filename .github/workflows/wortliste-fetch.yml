name: Fetch Goethe A1 word list

# One-off: downloads the public Goethe-Zertifikat A1 word list and publishes its text in a
# private pre-release, so the headword list can be built from it. Removed once used.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/wortliste-fetch.yml"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download and extract
        run: |
          sudo apt-get install -y poppler-utils >/dev/null
          for u in \
            https://www.goethe.de/pro/relaunch/prf/de/A1_SD1_Wortliste_02.pdf \
            https://www.goethe.de/pro/relaunch/prf/sr/A1_SD1_Wortliste_02.pdf \
            https://www.goethe.de/resources/files/pdf37/A1_SD1_Wortliste_02.pdf ; do
            if curl -fsSL -A "Mozilla/5.0" -o wortliste.pdf "$u" && head -c 4 wortliste.pdf | grep -q '%PDF'; then echo "got $u"; break; fi
          done
          pdftotext -layout wortliste.pdf layout.txt
          pdftotext wortliste.pdf plain.txt
          wc -l layout.txt plain.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete lexicon-probe --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release delete wortliste --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create wortliste layout.txt plain.txt --prerelease -R "$GITHUB_REPOSITORY" --title "word list text" --notes "Extracted text of the Goethe A1 word list."
